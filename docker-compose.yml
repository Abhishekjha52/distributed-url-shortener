version: "3.9"

services:
  app:
    container_name: url-shortener-app
    build: .
    image: distributed-url-shortener:latest
    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - .env.docker

    depends_on:
      - mongodb
      - redis
  mongodb:
    container_name: mongodb
    image: mongo:8
    restart: unless-stopped

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongodb_data: